<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawa - نظام إدارة الصيدليات العربي</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#eef1f6;color:#222b3a;min-height:100vh}
.sidebar{width:236px;position:fixed;top:0;right:0;bottom:0;background:linear-gradient(180deg,#1c2942,#141e33);color:#aeb9cc;padding:18px 12px;overflow-y:auto;z-index:60}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;font-size:1.12rem;font-weight:bold;color:#fff}
.sb-logo .pill{font-size:.62rem;background:#2f80ed;border-radius:20px;padding:2px 9px;margin-right:auto}
.tab{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:3px;background:none;border:none;color:#aeb9cc;font-size:.87rem;font-family:inherit;cursor:pointer;border-radius:10px;text-align:right;white-space:nowrap}
.tab .ic{font-size:1rem;width:22px;text-align:center}
.tab:hover{background:rgba(255,255,255,.06);color:#fff}
.tab.active{background:linear-gradient(90deg,#2f80ed,#1d62c9);color:#fff;font-weight:bold;box-shadow:0 4px 12px rgba(47,128,237,.35)}
.sb-foot{margin-top:18px;font-size:.68rem;color:#5f6c84;text-align:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);line-height:1.9}
.main{margin-right:236px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:#ffffff;display:flex;align-items:center;gap:10px;padding:12px 20px;box-shadow:0 2px 10px rgba(20,30,60,.06)}
.topbar h1{font-size:1.05rem;color:#1c2942;white-space:nowrap}
.tb-sp{flex:1}
.tbtn{border:1px solid #dde3ee;background:#f7f9fd;color:#2f80ed;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:.8rem;font-weight:bold;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:#eaf2ff}
.tbtn.solid{background:linear-gradient(135deg,#2f80ed,#1d62c9);color:#fff;border:none}
#login-user-name{font-size:.83rem;color:#42506b;font-weight:bold;white-space:nowrap}
.content{padding:18px 20px;max-width:1250px;width:100%;margin:0 auto}
.hero{background:linear-gradient(120deg,#1e3a8a,#2f80ed 55%,#4aa3f0);border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;box-shadow:0 8px 24px rgba(30,58,138,.22)}
.hero h2{font-size:1.15rem;color:#fff;margin-bottom:6px}
.hero p{font-size:.82rem;color:#d6e5ff;margin-bottom:13px}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:9px 16px;border-radius:10px;font-family:inherit;font-size:.83rem;font-weight:bold;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hero-side{margin-right:auto}
.live{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);padding:5px 13px;border-radius:20px;font-size:.72rem}
.live .dot{width:8px;height:8px;border-radius:50%;background:#2ee66b;box-shadow:0 0 8px #2ee66b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:#ffffff;border:1px solid #e7ebf3;border-radius:16px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(20,30,60,.04);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .num{font-size:1.2rem;font-weight:bold;color:#1c2942}
.card .lbl{font-size:.74rem;color:#8b94a3;margin-top:5px}
.page{display:none}
.page.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:1.05rem;margin-bottom:10px;color:#1c2942}
h3{font-size:.92rem;margin:12px 0 8px;color:#2f80ed}
h4{font-size:.85rem;margin:10px 0 6px;color:#6b7690}
input,select,textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid #dbe1ec;background:#fbfcfe;color:#222b3a;font-size:.9rem;font-family:inherit;margin-bottom:9px}
input:focus,select:focus{outline:none;border-color:#2f80ed;box-shadow:0 0 0 3px rgba(47,128,237,.12)}
.btn{background:linear-gradient(135deg,#2f80ed,#1d62c9);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:.88rem;cursor:pointer;font-family:inherit;font-weight:bold}
.btn:hover{opacity:.9}.btn.small{padding:4px 10px;font-size:.75rem}
table{width:100%;border-collapse:collapse;background:#ffffff;border-radius:14px;overflow:hidden;margin-bottom:11px;font-size:.83rem;box-shadow:0 2px 8px rgba(20,30,60,.04)}
th{background:#2f80ed;color:#fff;padding:9px 8px;text-align:right}
td{padding:8px;border-top:1px solid #eef1f6;vertical-align:top}
tr:hover td{background:#f7faff}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:bold}
.badge.ok{background:#e2f6ec;color:#1e7e44}.badge.out{background:#fdeaea;color:#c0392b}.badge.low{background:#fdf3e0;color:#b9770e}
.alert{padding:10px 13px;border-radius:10px;margin:7px 0;font-size:.87rem;line-height:1.7}
.alert.danger{background:#fdeaea;color:#a93226}.alert.warn{background:#fdf3e0;color:#9c6500}.alert.success{background:#e2f6ec;color:#1e7e44}
.muted{color:#8b94a3;font-size:.78rem}.hint{color:#9aa3b5;font-size:.76rem;margin-top:5px}
.ok-text{color:#1e9e50}.profit{color:#1e9e50;font-weight:bold}.debt-rem{color:#c0392b;font-weight:bold}
.search-row{display:flex;gap:8px;margin-bottom:10px}.search-row input{flex:1;margin-bottom:0}
#ix-picker{max-height:220px;overflow-y:auto;background:#fff;border-radius:12px;padding:9px;margin-bottom:11px;border:1px solid #e7ebf3}
.chk{display:block;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.86rem}.chk:hover{background:#f2f6ff}.chk input{margin-left:7px}
#chat-box{background:#fff;border:1px solid #e7ebf3;border-radius:14px;padding:13px;height:300px;overflow-y:auto;margin-bottom:9px}
.msg{padding:8px 12px;border-radius:12px;margin-bottom:7px;max-width:88%;line-height:1.8;font-size:.88rem}
.msg.user{background:#dbeafe;color:#1e3a8a;margin-right:auto}.msg.bot{background:#f1f4fa;color:#222b3a}
.chat-row{display:flex;gap:8px}.chat-row input{flex:1;margin-bottom:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.sell-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px}
.sum-row{display:flex;justify-content:space-between;padding:7px 12px;background:#ffffff;border:1px solid #e7ebf3;border-radius:10px;margin-bottom:5px;font-size:.9rem}
.sum-row.total{background:linear-gradient(135deg,#2f80ed,#1d62c9);color:#fff;font-size:1rem;font-weight:bold;border:none}
.set-sec{background:#ffffff;border:1px solid #e7ebf3;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,30,60,.04)}
.set-sec h3{margin-top:0}
.link-btn{background:none;border:1px solid #dbe1ec;color:#8b94a3;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.8rem}
#bc-video{width:100%;max-width:380px;border-radius:12px;display:none;margin:9px 0;background:#000}
.logout{background:#eef1f6;color:#c0392b;border:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:bold;white-space:nowrap}
.logout:hover{background:#fdeaea}
@media print{body{background:#fff}.sidebar,.topbar,.overlay,#chat-box,.btn{display:none!important}.main{margin:0}}
.listening{background:linear-gradient(135deg,#f39c12,#e67e22)!important;animation:vpulse 1s infinite!important}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.55}}
.voice-card{background:#fff;border:2px solid #2f80ed;border-radius:14px;padding:14px;margin:10px 0;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(22,32,54,.55);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;padding:20px}
.overlay .box{background:#ffffff;border:1px solid #e7ebf3;border-radius:20px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(10,20,50,.25)}
.overlay h2{color:#2f80ed;margin-bottom:16px}
.country-btn{display:block;width:100%;margin:10px 0;padding:15px;background:#f7f9fd;border:2px solid #dbe1ec;border-radius:12px;color:#222b3a;font-size:1.05rem;cursor:pointer;font-family:inherit}
.country-btn:hover{border-color:#2f80ed;background:#eaf2ff}
.login-input{width:100%;padding:12px;border-radius:10px;border:1px solid #dbe1ec;background:#fbfcfe;color:#222b3a;margin-bottom:12px;font-family:inherit;font-size:1rem}
@media(max-width:860px){
 .sidebar{position:static;width:100%;height:auto;display:flex;flex-wrap:wrap;align-items:center;padding:10px}
 .sb-logo{width:100%;padding-bottom:10px;margin-bottom:8px}
 .tab{width:auto;flex:1;min-width:64px;justify-content:center;font-size:.7rem;padding:9px 4px}
 .tab .ic{display:block;font-size:1.05rem;margin:0 auto 3px}
 .sb-foot{display:none}
 .main{margin-right:0}
 .topbar{flex-wrap:wrap}
}
/* ===== نمط الهاتف: قائمة علوية ===== */
.mtabs{display:none}
@media(max-width:860px){
 body{font-size:15px}
 .sidebar{display:none!important}
 .main{margin-right:0}
 .content{padding:12px;max-width:100%}
 .topbar{padding:10px 12px;gap:8px;height:57px;box-sizing:border-box}
 .tbtn{display:none}
 .topbar h1{font-size:.92rem}
 #login-user-name{font-size:.75rem;max-width:90px;overflow:hidden;text-overflow:ellipsis}
 #trial-badge{font-size:.62rem;padding:2px 6px}
 .hero{padding:16px;border-radius:16px;margin-bottom:12px}
 .hero-side{display:none}
 .hero h2{font-size:1.05rem}
 .hero p{font-size:.76rem;margin-bottom:10px}
 .hero-btns{gap:6px}
 .hbtn{padding:8px 10px;font-size:.74rem;flex:1;min-width:30%;text-align:center}
 .cards{grid-template-columns:repeat(2,1fr);gap:8px}
 .card{padding:11px 8px;border-radius:14px}
 .card .num{font-size:1.05rem}
 .card .lbl{font-size:.68rem}
 input,select,textarea{padding:12px;font-size:.95rem;border-radius:12px}
 .btn{padding:12px 20px;border-radius:12px;font-size:.95rem}
 .btn.small{padding:6px 12px;font-size:.78rem}
 h2{font-size:1rem}h3{font-size:.88rem}
 table{font-size:.76rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .set-sec{padding:13px;border-radius:14px}
 .voice-card{padding:12px}
 #chat-box{height:46vh}
 .sell-row{grid-template-columns:1.6fr 1fr auto;gap:6px}
 #bc-video{max-width:100%}
 /* شريط التبويبات العلوي: لاصق تحت الهيدر، قابل للتمرير الأفقي */
 .mtabs{display:flex;position:sticky;top:57px;z-index:70;background:#ffffff;border-bottom:1px solid #e7ebf3;box-shadow:0 2px 10px rgba(20,30,60,.05);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 4px}
 .mtabs::-webkit-scrollbar{display:none}
 .mtab{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:none;border:none;border-bottom:3px solid transparent;color:#8b94a3;font-family:inherit;font-size:.74rem;font-weight:bold;cursor:pointer;padding:11px 11px 9px;white-space:nowrap}
 .mtab .ic{font-size:1.02rem}
 .mtab.active{color:#2f80ed;border-bottom-color:#2f80ed}
}
</style>
</head>
<body>
<div class="overlay" id="onboard"><div class="box"><h2>💊 Dawa</h2><p style="color:#8a7f70;margin-bottom:14px" data-t="choose_country">اختر دولة الصيدلية / Choose your country</p><div id="ob-countries"></div></div></div>
<div class="overlay" id="setup" style="display:none"><div class="box"><h2>🛠️ <span data-t="setup_title"></span></h2><p class="hint" style="margin-bottom:14px" data-t="setup_sub"></p><input type="text" id="su-ph" class="login-input" data-t-ph="su_phname"><input type="text" id="su-user" class="login-input" data-t-ph="su_user"><input type="password" id="su-pass" class="login-input" data-t-ph="su_pass"><input type="password" id="su-pass2" class="login-input" data-t-ph="su_pass2"><div id="su-err" style="color:#dc2626;min-height:20px;font-size:.85rem"></div><button class="btn" style="width:100%" onclick="doSetup()" data-t="setup_btn"></button></div></div>
<div class="overlay" id="activate" style="display:none"><div class="box"><h2>🔐 <span data-t="act_title"></span></h2><p style="color:#fbbf24;font-size:.85rem;margin-bottom:10px;min-height:18px" id="act-trial-msg"></p><p class="hint" style="margin-bottom:12px"><span data-t="act_sub"></span></p><input type="text" id="ac-name" class="login-input" data-t-ph="act_name" placeholder="اسم الصيدلية"><input type="text" id="ac-code" class="login-input" data-t-ph="act_code" placeholder="PHARMA-XXXXXXX-XXXX" style="direction:ltr;text-align:left"><div id="ac-err" style="color:#dc2626;min-height:20px;font-size:.85rem"></div><button class="btn" style="width:100%" onclick="doActivate()" data-t="act_btn"></button><p class="hint" style="margin-top:10px" data-t="act_contact"></p></div></div>
<div class="overlay" id="login"><div class="box"><h2>🔐 <span data-t="login">تسجيل الدخول</span></h2><input type="text" id="lg-user" class="login-input" placeholder="admin"><input type="password" id="lg-pass" class="login-input" placeholder="••••"><div id="lg-err" style="color:#dc2626;min-height:20px"></div><button class="btn" style="width:100%" <button class="btn" style="width:100%" onclick="doLogin()" data-t="login">دخول</button><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="link-btn" onclick="setLangQuick('ar')">العربية</button><button class="link-btn" onclick="setLangQuick('en')">English</button><button class="link-btn" onclick="setLangQuick('ckb')">کوردی</button></div><p class="hint" style="margin-top:10px" data-t="login_hint"></p></div></div>
<div id="app" style="display:none">
<aside class="sidebar">
<div class="sb-logo">💊 <span>Dawa</span><span class="pill">v2.0</span></div>
<button class="tab active" id="tab-home" onclick="switchTab('home')"><span class="ic">🏠</span><span data-t="home"></span></button>
<button class="tab" id="tab-sell" onclick="switchTab('sell')"><span class="ic">🧾</span><span data-t="sell"></span></button>
<button class="tab" id="tab-drugs" onclick="switchTab('drugs')"><span class="ic">💊</span><span data-t="drugs"></span></button>
<button class="tab" id="tab-inv" onclick="switchTab('inv')"><span class="ic">📦</span><span data-t="inv"></span></button>
<button class="tab" id="tab-sup" onclick="switchTab('sup')"><span class="ic">🚚</span><span data-t="sup"></span></button>
<button class="tab" id="tab-cust" onclick="switchTab('cust')"><span class="ic">👥</span><span data-t="cust"></span></button>
<button class="tab" id="tab-rep" onclick="switchTab('rep')"><span class="ic">📊</span><span data-t="rep"></span></button>
<button class="tab" id="tab-ix" onclick="switchTab('ix')"><span class="ic">⚠️</span><span data-t="ix"></span></button>
<button class="tab" id="tab-chat" onclick="switchTab('chat')"><span class="ic">🤖</span><span data-t="chat"></span></button>
<button class="tab" id="tab-set" onclick="switchTab('set')"><span class="ic">⚙️</span><span data-t="set"></span></button>
<div class="sb-foot">Dawa v2.0<br><span data-t="footer_sub"></span></div>
</aside>
<div class="main">
<header class="topbar">
<h1>📋 <span data-t="dash"></span></h1>
<div class="tb-sp"></div>
<button class="tbtn solid" onclick="switchTab('sell')">🧾 <span data-t="tb_sell"></span></button>
<button class="tbtn" onclick="switchTab('drugs')">🔍 <span data-t="tb_search"></span></button>
<span id="login-user-name"></span>
<span id="trial-badge" class="badge low" style="display:none"></span>
<button class="logout" onclick="doLogout()">⏻ <span data-t="tb_out"></span></button>
</header>
<div class="content">
<div class="page active" id="page-home">
<div class="hero">
<div>
<h2>👋 <span data-t="hello"></span> <span id="hero-user"></span></h2>
<p><span data-t="hero_s1"></span> <b id="hero-ph"></b> <span data-t="hero_s2"></span></p>
<div class="hero-btns">
<button class="hbtn" onclick="switchTab('sell')">🧾 <span data-t="hb_sell"></span></button>
<button class="hbtn" onclick="switchTab('drugs')">💊 <span data-t="hb_drugs"></span></button>
<button class="hbtn" onclick="switchTab('inv')">📦 <span data-t="hb_inv"></span></button>
<button class="hbtn" onclick="switchTab('rep')">📊 <span data-t="hb_rep"></span></button>
</div>
</div>
<div class="hero-side"><span class="live"><span class="dot"></span> LIVE</span></div>
</div><div class="cards"><div class="card"><div class="num" id="st-today">-</div><div class="lbl" data-t="sales_today"></div></div><div class="card"><div class="num" id="st-profit">-</div><div class="lbl" data-t="profit"></div></div><div class="card"><div class="num" id="st-val">-</div><div class="lbl" data-t="stock_val"></div></div><div class="card"><div class="num" id="st-count">-</div><div class="lbl" data-t="drugs"></div></div><div class="card"><div class="num" id="st-low">-</div><div class="lbl" data-t="low"></div></div><div class="card"><div class="num" id="st-exp">-</div><div class="lbl" data-t="exp"></div></div><div class="card"><div class="num" id="st-oos">-</div><div class="lbl" data-t="oos"></div></div></div><h2 data-t="exp"></h2><div id="home-exp"></div><h2 data-t="low"></h2><div id="home-low"></div><h2>🛒</h2><table><tr><th></th><th data-t="drugs"></th><th data-t="qty"></th><th data-t="total"></th></tr><tbody id="home-sales"></tbody></table><h2 data-t="moves"></h2><table><tr><th></th><th></th><th data-t="drugs"></th><th data-t="qty"></th></tr><tbody id="home-moves"></tbody></table></div><div class="page" id="page-sell"><h2 data-t="sell"></h2><div class="sell-row"><select id="sell-drug"></select><input type="number" id="sell-qty" value="1" min="1"><button class="btn" onclick="addToCart(+document.getElementById('sell-drug').value,+document.getElementById('sell-qty').value)">＋</button></div><input type="text" id="bc-manual" placeholder="Barcode" onchange="onBarcode(this.value)"><button class="link-btn" onclick="startBarcode()">📷</button><video id="bc-video" playsinline muted></video><div id="bc-result"></div>
<h3>🎙️ <span data-t="voice_title"></span></h3>
<button class="btn" id="voice-btn" style="width:100%" onclick="startVoice()">🎙️ <span data-t="voice_btn"></span></button>

const ACT_SECRET='PHX-9f2K$qR7mZ!2026';
const TRIAL_DAYS=14;
function fnv1a(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h;}
function actSign(p){var sg=fnv1a(p+'|'+ACT_SECRET).toString(36).toUpperCase();while(sg.length<7)sg='0'+sg;return sg.slice(0,7);}
function verifyCode(code,name){
  var m=(code||'').trim().match(/^PHARMA-([0-9A-Za-z]{7})-([A-Za-z0-9+/]+)$/);
  if(!m)return{ok:false,err:'format'};
  var payload;try{payload=decodeURIComponent(escape(atob(m[2])));}catch(e){return{ok:false,err:'format'};}
  if(actSign(payload)!==m[1].toUpperCase())return{ok:false,err:'format'};
  var parts=payload.split('|');
  if(parts[0].toUpperCase()!==name.trim().toUpperCase())return{ok:false,err:'name'};
  var months=+parts[1]||0,ts=+parts[2]||0;
  var exp=months===0?0:ts+months*30*864e5;
  if(exp&&Date.now()>exp)return{ok:false,err:'expired'};
  return{ok:true,name:parts[0],months:months,exp:exp};
}
function isAct(){return !!(ST.activated&&ST.act&&(!ST.act.exp||Date.now()<ST.act.exp));}
function trialInfo(){
  if(!ST.firstRun){ST.firstRun=Date.now();save();}
  var left=TRIAL_DAYS-Math.floor((Date.now()-ST.firstRun)/864e5);
  return{left:Math.max(0,left),total:TRIAL_DAYS};
}
function needActivation(){
  if(isAct())return false;
  var tr=trialInfo();
  if(tr.left>0){showTrialBadge(tr.left);return false;}
  showActivate();return true;
}

function doActivate(fromSettings){
  var nameEl=document.getElementById(fromSettings?'as-name':'ac-name');
  var codeEl=document.getElementById(fromSettings?'as-code':'ac-code');
  var errEl=document.getElementById(fromSettings?'as-err':'ac-err');
  var name=nameEl.value.trim(),code=codeEl.value.trim();
  var r=verifyCode(code,name);
  if(!r.ok){
    errEl.textContent=t(r.err==='name'?'act_err_name':r.err==='expired'?'act_err_exp':'act_err_format');
    return;
  }
  ST.activated=true;ST.act={name:r.name,months:r.months,exp:r.exp,ts:Date.now()};
  if(!ST.pharmacy)ST.pharmacy={name:r.name,addr:'',phone:'',logo:''};
  save();
  document.getElementById('activate').style.display='none';
  var b=document.getElementById('trial-badge');if(b)b.style.display='none';
  if(fromSettings){renderSettings();}
  else{showLogin();}
  alert(t('act_ok'));
}
function deactivate(){
  if(!can('set'))return alert('✖');
  if(!confirm('إلغاء التفعيل؟ ستحتاج كوداً جديداً.'))return;
  ST.activated=false;ST.act=null;save();
  document.getElementById('app').style.display='none';
  showActivate();
}
function renderActStatus(){
  var st=document.getElementById('act-st');if(!st)return;
  if(isAct()){
    st.innerHTML='<span class="ok-text">✓ '+t('act_active')+'</span>';
    document.getElementById('act-exp').textContent=ST.act.exp?new Date(ST.act.exp).toLocaleDateString('ar'):t('act_permanent');
    document.getElementById('act-box-set').style.display='none';
    document.getElementById('btn-deact').style.display=(curUser()&&curUser().role==='admin')?'inline-block':'none';
  }else{
    var tr=trialInfo();
    st.innerHTML='<span style="color:#b45309">'+t('act_trial')+'</span>';
    document.getElementById('act-exp').textContent=tr.left>0?tr.left+' '+t('act_day')+' '+t('act_left'):t('act_trial_end');
    document.getElementById('act-box-set').style.display='block';
    document.getElementById('btn-deact').style.display='none';
  }
}

  if(s){ (s.customDrugs||[]).forEach(cd=>{ if(!PRODUCTS.find(d=>d.id===cd.id)) PRODUCTS.push(cd); });
    if(s.stkOverride) PRODUCTS.forEach(d=>{ if(s.stkOverride[d.id]) d.batches=s.stkOverride[d.id]; }); } })();

const fmt=n=>n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const nowStr=()=>{const d=new Date();return todayStr()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function pStock(d){ return (d.batches||[]).reduce((s,b)=>s+(+b.q||0),0); }
function pCost(d){ const bs=d.batches||[]; const q=bs.reduce((s,b)=>s+(+b.q||0),0);
  return q>0? bs.reduce((s,b)=>s+(+b.q||0)*(+b.pc||d.pc||0),0)/q : (d.pc||0); }
function expDaysOf(ex){ if(!ex) return 99999; const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(ex+'T00:00:00')-t)/86400000); }
function nearestExpiry(d){ const es=(d.batches||[]).filter(b=>b.q>0).map(b=>expDaysOf(b.ex)); return es.length?Math.min(...es):99999; }
const stockBadge=d=>pStock(d)>0?'<span class="badge ok">'+pStock(d)+'</span>':'<span class="badge out">'+t('oos')+'</span>';

// ====== FEFO: سحب الكمية من الأقدم انتهاءً ======
function fefoTake(d,qty){
  const bs=[...(d.batches||[])].sort((a,b)=>expDaysOf(a.ex)-expDaysOf(b.ex));
  let rem=qty;
  for(const b of bs){ if(rem<=0)break; const take=Math.min(b.q,rem); b.q-=take; rem-=take; }
  d.batches=bs.filter(b=>b.q>0);
  return qty-rem; // المأخوذ فعلياً
}
function fefoRestock(d,qty){
  // المرتجع يعود لدفعة جديدة مؤقتة
  d.batches=d.batches||[]; d.batches.push({bn:'RET-'+Date.now(),q:qty,ex:'2099-12-31',pc:d.pc});
}

// ====== سجل حركات المخزون ======
function logMove(type,d,qty,reason,extra){
  const before=pStock(d);
  ST.transactions.push({id:Date.now()+Math.random(),ts:nowStr(),user:(curUser()||{}).name||'-',
    type,pid:d.id,pname:d.n,qty,reason:reason||'',before,after:before+ (['in','ret_s','adj_in'].includes(type)?qty:0) - (['out','sale','ret_p','adj_out'].includes(type)?qty:0),
    ...(extra||{})});
  ST.stkOverride[d.id]=d.batches; save();
}

let cart=[]; let salePay='cash'; let saleDisc=0; let saleCust=null;
function addToCart(id,qty){qty=qty||1;const ex=cart.find(c=>c.id===id);if(ex)ex.qty+=qty;else cart.push({id,qty});renderCart();}
function renderCart(){
  const box=document.getElementById('cart');const tot=document.getElementById('cart-total');
  if(!cart.length){box.innerHTML='<p class="muted">'+t('cart')+' —</p>';tot.textContent='—';calcTotals();return;}
  let sub=0;
  box.innerHTML='<table><tr><th>'+t('drugs')+'</th><th>'+t('qty')+'</th><th>'+t('price')+'</th><th>'+t('total')+'</th><th></th></tr>'+
    cart.map((c,i)=>{const d=PRODUCTS.find(x=>x.id===c.id);const line=d.p*c.qty;sub+=line;
      return '<tr><td>'+esc(d.n)+'</td><td><input type="number" value="'+c.qty+'" min="1" style="width:56px" onchange="cart['+i+'].qty=+this.value;renderCart()"></td><td>'+fmt(d.p)+'</td><td>'+fmt(line)+'</td><td><button class="btn small" style="background:#c05555" onclick="cart.splice('+i+',1);renderCart()">×</button></td></tr>';}).join('')+'</table>';
  tot.textContent=fmt(sub); calcTotals();
}
function calcTotals(){
  const sub=cart.reduce((s,c)=>{const d=PRODUCTS.find(x=>x.id===c.id);return s+d.p*c.qty;},0);
  const disc=saleDisc||0;
  const taxable=sub-disc;
  const tax=ST.taxOn?Math.round(taxable*(ST.taxPct||0)/100):0;
  const total=taxable+tax;
  const el=document.getElementById('sale-summary');
  if(el) el.innerHTML='<div class="sum-row"><span>'+t('total')+'</span><b>'+fmt(sub)+' '+ST.baseCurr+'</b></div>'+
    (disc?'<div class="sum-row"><span>'+t('disc')+'</span><b>-'+fmt(disc)+'</b></div>':'')+
    (tax?'<div class="sum-row"><span>'+esc(ST.taxName)+'</span><b>+'+fmt(tax)+'</b></div>':'')+
    '<div class="sum-row total"><span>'+t('total')+'</span><b>'+moneyFmt(total)+'</b></div>';
  return {sub,disc,tax,total};
}
function checkout(){
  if(!cart.length)return;
  const {disc,tax,total}=calcTotals();
  const invNo=ST.saleSeq++;
  const inv={id:Date.now(),no:invNo,ts:nowStr(),user:(curUser()||{}).name||'-',pay:salePay,cust:saleCust||'',
    disc:disc||0,tax:tax||0,total,items:[],branch:ST.pharmacy.name};
  cart.forEach(c=>{const d=PRODUCTS.find(x=>x.id===c.id);
    if(pStock(d)<c.qty){alert('⚠️ '+d.n+': '+t('oos'));return;}
    const taken=fefoTake(d,c.qty);
    const cost=pCost(d)*taken;
    inv.items.push({pid:d.id,name:d.n,qty:taken,price:d.p,cost,total:d.p*taken,batch:(d.batches[0]||{}).bn||'-'});
    logMove('sale',d,taken,'',inv);
    ST.sales.push({ts:inv.ts,inv:invNo,name:d.n,qty:taken,price:d.p,cost,total:d.p*taken,pay:salePay,customer:saleCust||''});
  });
  // دين → للعميل
  if(salePay==='credit'&&saleCust){const cu=ST.customers.find(x=>x.id===saleCust);if(cu)cu.balance+=total;}
  cart=[];saleDisc=0;saleCust=null;persistAll();renderSell();renderHome();
  const r=document.getElementById('sell-result');
  r.innerHTML='<div class="alert success">✅ '+t('invoice')+' #'+invNo+' — <b>'+moneyFmt(total)+'</b></div>'+
    '<button class="btn" onclick="printInvoice('+inv.id+')">🖨️ '+t('print')+'</button>';
}
function printInvoice(id){
  const inv=ST.sales&&id?null:null;
  const lastInv={id:Date.now(),no:ST.saleSeq-1,ts:nowStr()};
  // إعادة بناء آخر فاتورة من السجل

}

  const items=ST.sales.filter(s=>s.inv===no);
  if(!items.length)return;
  const total=items.reduce((s,x)=>s+x.total,0);

    '<div style="text-align:center"><b style="font-size:1.1rem">'+esc(ST.pharmacy.name)+'</b><br>'+
    esc(ST.pharmacy.addr)+'<br>'+esc(ST.pharmacy.phone)+'</div><hr>'+
    '<div>'+t('invoice_no')+': '+no+' | '+items[0].ts+'<br>'+t('emp')+': '+esc(items[0].user||'-')+'</div><hr>'+
    '<table style="width:100%;font-size:.8rem">'+items.map(x=>'<tr><td>'+esc(x.name)+'×'+x.qty+'</td><td style="text-align:left">'+fmt(x.total)+'</td></tr>').join('')+'</table><hr>'+
    '<div style="text-align:center;font-size:1.1rem"><b>'+t('total')+': '+fmt(total)+' '+ST.baseCurr+'</b></div>'+
    '<div style="text-align:center;font-size:.75rem;margin-top:8px">'+esc(ST.invFooter)+'</div></div>';
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
}
function deleteSale(id){
  if(!can('del_sale')){alert('⛔ '+t('perm_del_sale'));return;}

function invIn(pid){
  const d=PRODUCTS.find(x=>x.id===pid);if(!d)return;
  const q=+prompt(t('in')+' — '+d.n+' ('+t('qty')+'):','');if(!q)return;
  const ex=prompt(t('expiry')+' (YYYY-MM-DD):','2027-12-01')||'2027-12-01';
  const bn=prompt(t('batch')+':','B'+Date.now()%10000)||'-';
  const pc=+prompt(t('cost')+':',d.pc)||d.pc;
  d.batches=d.batches||[];d.batches.push({bn,q,ex,pc});
  logMove('in',d,q,t('in'),{ex,bn});renderInv();
}
function invOut(pid){
  if(!can('adj')){alert('⛔');return;}
  const d=PRODUCTS.find(x=>x.id===pid);const q=+prompt(t('out')+' — '+d.n+' ('+t('qty')+'):','');if(!q)return;
  const reason=prompt(t('reason')+':','')||'';
  fefoTake(d,Math.min(q,pStock(d)));logMove('out',d,q,reason);renderInv();
}
function invCount(pid){
  const d=PRODUCTS.find(x=>x.id===pid);
  const actual=+prompt(t('count')+' — '+d.n+' ('+t('actual')+'):',pStock(d));if(actual==null)return;
  const diff=actual-pStock(d);
  if(diff>0){d.batches.push({bn:'CNT-'+Date.now(),q:diff,ex:'2099-12-31',pc:d.pc});logMove('adj_in',d,diff,t('count'));}
  else if(diff<0){fefoTake(d,-diff);logMove('adj_out',d,-diff,t('count'));}

function renderProfits(){
  const now=new Date();const month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const inp=document.getElementById('profit-month');if(inp&&!inp.value)inp.value=month;
  calcProfits();
}
function calcProfits(){
  const month=(document.getElementById('profit-month')||{value:todayStr().slice(0,7)}).value;
  const sales=ST.sales.filter(s=>s.ts.startsWith(month));
  const total=sales.reduce((s,x)=>s+x.total,0);
  const cost=sales.reduce((s,x)=>s+x.cost*x.qty,0);
  const profit=total-cost;
  const byDay={};sales.forEach(s=>{const d=s.ts.slice(0,10);byDay[d]=byDay[d]||{t:0,p:0,c:0};byDay[d].t+=s.total;byDay[d].p+=(s.price-s.cost)*s.qty;byDay[d].c++;});
  const byPay={};sales.forEach(s=>{byPay[s.pay||'cash']=(byPay[s.pay||'cash']||0)+s.total;});
  const byDrug={};sales.forEach(s=>{byDrug[s.name]=byDrug[s.name]||{q:0,t:0,p:0};byDrug[s.name].q+=s.qty;byDrug[s.name].t+=s.total;byDrug[s.name].p+=(s.price-s.cost)*s.qty;});
  const days=Object.keys(byDay).sort();
  const el=id=>document.getElementById(id);
  el('pf-sales').textContent=moneyFmt(total);
  el('pf-profit').textContent=moneyFmt(profit);
  el('pf-count').textContent=sales.length;
  el('pf-usd').textContent=ST.secCurr?((profit/ST.rate).toFixed(2)+' '+ST.secCurr):'-';
  el('pf-pay').innerHTML=Object.entries(byPay).map(([k,v])=>{const pm=(ST.payMethods||[]).find(p=>p.id===k);return '<div class="sum-row"><span>'+esc(pm?(ST.lang==='ar'?pm.ar:pm.en):k)+'</span><b>'+moneyFmt(v)+'</b></div>';}).join('')||'<p class="muted">—</p>';
  el('pf-days').innerHTML=days.length?'<table><tr><th>'+t('date')+'</th><th>#</th><th>'+t('total')+'</th><th>'+t('profit')+'</th></tr>'+days.map(d=>'<tr><td>'+d+'</td><td>'+byDay[d].c+'</td><td>'+fmt(byDay[d].t)+'</td><td class="profit">'+fmt(byDay[d].p)+'</td></tr>').join('')+'</table>':'<p class="muted">—</p>';
  el('pf-drugs').innerHTML=Object.entries(byDrug).sort((a,b)=>b[1].p-a[1].p).slice(0,15).map(([n,v])=>'<tr><td>'+esc(n)+'</td><td>'+v.q+'</td><td>'+fmt(v.t)+'</td><td class="profit">'+fmt(v.p)+'</td></tr>').join('');
}

function checkIX(ids){const drugs=ids.map(id=>PRODUCTS.find(x=>x.id===id)).filter(Boolean);const out=[];
  for(let i=0;i<drugs.length;i++)for(let j=i+1;j<drugs.length;j++){const a=drugs[i],b=drugs[j];
    for(const[ia,ib,sev,note]of IX){const h1=a.ing.includes(ia)&&(b.ing.includes(ib)||b.cl.includes(ib));
      const h2=b.ing.includes(ia)&&(a.ing.includes(ib)||a.cl.includes(ib));
      if(h1||h2)out.push({a:a.n,b:b.n,sev,note});}}
  return out;}

function pedsDose(q){
  const m=q.match(/(\d+)\s*(كيلو|كغ|kilo|kg)/i);if(!m)return null;
  const w=+m[1];if(w<1||w>100)return null;
  let drug=bestMatch(q);
  let base=null;
  for(const[ing,dosePerKg,freq]of PEDS){
    if(!drug||drug.ing.includes(ing.split('/')[0])){base={ing,dosePerKg,freq};if(drug)break;}
  }
  if(!base)base={ing:(drug?drug.ing:'-'),dosePerKg:'- (راجع المرجع)',freq:'-'};
  const lo=Math.round(w*10),hi=Math.round(w*15);
  return '👶 <b>'+t('chat')+' — '+w+' kg</b><br>'+(drug?esc(drug.n)+' ('+esc(drug.ing)+')<br>':'')
    +'الجرعة المرجعية: <b>'+base.dosePerKg+'</b><br>'
    +(base.dosePerKg.includes('15')?'يعني تقريباً: <b>'+fmt(lo)+' - '+fmt(hi)+' ملغ/جرعة</b><br>':'')
    +'التكرار: '+base.freq+'<br><span class="hint">⚕️ دائماً أكّد من المرجع — القرار للصيدلي</span>';
}
function pregCheck(q){
  let drug=bestMatch(q);
  if(!drug)return '🤰 حدّد اسم الدواء للتحقق من أمانه بالحمل — مثال: "ديوكسي للحامل؟"';
  for(const[ing,warn]of PREG_UNSAFE){
    if(drug.ing.includes(ing)||drug.n.includes(ing))return '🤰 <b>'+esc(drug.n)+'</b>: '+warn;
  }
  return '🤰 <b>'+esc(drug.n)+'</b>: ضمن الأدوية الشائعة — لكن القرار النهائي للطبيب/الصيدلي مع تقييم الحالة.';
}
function bestMatch(q){let best=null,bs=0;for(const d of PRODUCTS){let s=0;
  if(q.includes(d.n))s+=10;if(q.includes(d.ing.split('/')[0]))s+=6;
  const w=d.n.split(' ')[0];if(w.length>2&&q.includes(w))s+=4;if(s>bs){bs=s;best=d;}}return best;}
function chatSend(){const inp=document.getElementById('chat-input');const q=inp.value.trim();if(!q)return;inp.value='';
  addMsg('user',esc(q));const r=botReply(q);
  if(typeof r==='string')addMsg('bot',r);else r.then(x=>addMsg('bot',esc(x))).catch(()=>addMsg('bot','⚠️'));
  const b=document.getElementById('chat-box');b.scrollTop=b.scrollHeight;}
function addMsg(c,h){document.getElementById('chat-box').innerHTML+='<div class="msg '+c+'">'+h+'</div>';}
function botReply(q){
  if(/بديل|عوض/.test(q)){const d=bestMatch(q.replace(/بديل|عوض/g,''));if(!d)return'؟';
    const{sameIng,sameCls}=alts(d.id);let h='<b>'+esc(d.n)+'</b> — '+pStock(d);
    if(sameIng.length)h+='<br>'+sameIng.map(a=>'• '+esc(a.n)+' — '+a.p).join('<br>');
    else if(sameCls.length)h+='<br>'+sameCls.slice(0,6).map(a=>'• '+esc(a.n)).join('<br>');return h;}
  if(/سعر|بكم|متوفر/.test(q)){const d=bestMatch(q);if(!d)return'؟';
    return '<b>'+esc(d.n)+'</b> — '+moneyFmt(d.p)+' | '+pStock(d)+' | '+(d.rx?'Rx':'OTC');}
  if(/ربح|مبيعات/.test(q)){const td=todayStr();const s=ST.sales.filter(x=>x.ts.startsWith(td));
    return '📊 '+moneyFmt(s.reduce((a,x)=>a+x.total,0));}
  if(/حامل|حمل|رضاعة|emb/.test(q))return pregCheck(q);
  if(/طفل|طفلة|ولد|بنت|كيلو|كغ/.test(q)){const p=pedsDose(q);if(p)return p;}
  if(/جرعة|معلومات/.test(q)){const d=bestMatch(q);if(!d)return'؟';return esc(d.inf||'-')+'<br><span class="hint">⚕️</span>';}
  // أي سؤال آخر → AI مجاني أولاً، ثم المفتاح إن وُجد، ثم مساعدة عامة
  return aiReply(q);
}
async function aiReply(q){
  const ctx=PRODUCTS.slice(0,80).map(d=>'- '+d.n+' | '+d.ing+' | '+d.cl+' | سعر '+d.p+' | مخزون '+pStock(d)).join('\n');
  const sys='أنت مساعد صيدلاني محترف باللغة العربية. أجب بإيجاز ودقة اعتماداً على بيانات الأدوية التالية عند الصلة، وإلا استخدم معلوماتك الصيدلانية العامة. أضف دائماً في النهاية: القرار النهائي مسؤولية الصيدلي.\nالبيانات:\n'+ctx;
  // 1) خدمة AI مجانية بدون مفتاح (تشتغل بأي إنترنت)
  try{
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'system',content:sys},{role:'user',content:q}],model:'openai'}),signal:ctrl.signal});
    clearTimeout(to);
    if(r.ok){const txt=(await r.text()).trim();if(txt&&txt.length>5&&txt.length<4000)return txt;}
  }catch(e){}
  // 2) مفتاح OpenAI إن وُجد بالإعدادات
  if(ST.apiKey){try{
    const r=await fetch(ST.apiUrl+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ST.apiKey},
      body:JSON.stringify({model:ST.apiModel,messages:[{role:'system',content:sys},{role:'user',content:q}]})});
    const d=await r.json();return d.choices[0].message.content;
  }catch(e){}}
  // 3) أوفلاين: مساعدة عامة
  return '✋ <b>'+t('chat')+'</b><br>• بديل أوجمنتين<br>• سعر زيثروكان<br>• جرعة طفل 15 كيلو<br>• ديوكسي للحامل؟<br>• '+t('sales_today')+'<br><span class="hint">🌐 للأسئلة العامة: يحتاج إنترنت (مجاني)</span>';
}


// ====== البيع بالصوت v1.4 ======
const VOICE_NUM={'واحد':1,'وحده':1,'واحده':1,'اثنين':2,'اثنان':2,'زوج':2,'تنتين':2,'تنين':2,'ثلاث':3,'ثلاثه':3,'اربع':4,'اربعه':4,'خمس':5,'خمسه':5,'ست':6,'سته':6,'سبع':7,'سبعه':7,'ثمان':8,'ثمانيه':8,'تسع':9,'تسعه':9,'عشر':10,'عشره':10,'عشرين':20,'ثلاثين':30,'اربعين':40,'خمسين':50,'ميه':100,'مئه':100};
function normalizeAr(s){return String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).trim();}
function findDrugFuzzy(text){
  const n=normalizeAr(text);
  const stop=['بعت','بيع','علبه','علب','حبه','حبات','صندوق','للزبون','فاتوره','دواء','درزنه','درزن','شريط','شرائط','كرتون','قطعه','قطع','من','الي','الى','تنتين','صارت'];
  const words=n.split(/\s+/).filter(w=>w&&!stop.includes(w));
  if(!words.length)return null;
  let best=null,bs=0;
  for(const d of PRODUCTS){
    const dn=normalizeAr(d.n), ing=normalizeAr(d.ing.split('/')[0]);
    let s=0;
    for(const w of words){ if(w.length<2)continue;
      if(dn.includes(w))s+=w.length*2;
      if(ing.includes(w))s+=w.length; }
    if(n.includes(dn))s+=50;
    if(ing.length>3&&n.includes(ing))s+=30;
    // تشابه أحرف للكلمات الطويلة (تسامح أخطاء النطق)
    for(const w of words){ if(w.length>=5){
      let hit=0; for(const ch of new Set(w)){ if(dn.includes(ch))hit++; }
      if(hit/w.length>=0.7)s+=Math.round(w.length*1.5);
    }}
    if(s>bs){bs=s;best=d;}
  }
  return bs>=6?best:null;
}
function parseVoiceSale(text){
  const n=normalizeAr(text);
  let qty=1;
  const m=n.match(/(\d+)/); if(m)qty=parseInt(m[1],10);
  else{ const stop=['بعت','بيع','علبه','علب','حبه','حبات','صندوق','للزبون','فاتوره','دواء','درزنه','درزن','شريط','كرتون','قطعه','من','الي','الى'];
    const toks=n.split(/\s+/).filter(x=>x&&!stop.includes(x));
    const ws=Object.keys(VOICE_NUM).sort((a,b)=>b.length-a.length);
    for(const w of ws){ if(toks.includes(w)){qty=VOICE_NUM[w];break;} } }
  return {drug:findDrugFuzzy(text), qty:qty, heard:text};
}
let voiceRec=null;
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=document.getElementById('voice-status');
  const btn=document.getElementById('voice-btn');
  if(!SR){st.innerHTML='<div class="alert warn">🎙️ التعرف الصوتي غير مدعوم بهذا المتصفح — استخدم <b>Chrome</b></div>';return;}
  try{
    voiceRec=new SR();
    voiceRec.lang='ar-SY';voiceRec.interimResults=false;voiceRec.maxAlternatives=3;
    btn.classList.add('listening');
    st.innerHTML='<div class="alert warn">🎙️ جاري الاستماع... تحدث الآن</div>';
    voiceRec.onresult=function(e){
      btn.classList.remove('listening');
      const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
      let parsed=null;for(const a of alts){parsed=parseVoiceSale(a);if(parsed.drug)break;}
      if(!parsed||!parsed.drug){
        st.innerHTML='<div class="alert danger">❌ سمعت: "'+esc(alts[0])+'"<br>ما لقيت دواء بهاد الاسم — جرّب تكتبه بالبحث أو أعد المحاولة</div>';return;}
      window._voicePick=parsed;
      st.innerHTML='<div class="voice-card"><div class="muted">'+esc(parsed.heard)+'</div>'
        +'<div style="font-size:1.15rem;margin:10px 0"><b>'+parsed.qty+' × '+esc(parsed.drug.n)+'</b> — '+fmt(parsed.drug.p)+' '+ST.baseCurr+'</div>'
        +'<div style="display:flex;gap:8px;justify-content:center">'
        +'<button class="btn" onclick="confirmVoice()">✓ '+t('checkout')+'</button>'
        +'<button class="link-btn" onclick="cancelVoice()">✗ '+t('close')+'</button>'
        +'</div></div>';
    };
    voiceRec.onerror=function(e){
      btn.classList.remove('listening');
      const msgs={'not-allowed':'⛔ المايك محظور — اسمح به من إعدادات كروم (🔒 بالشريط)','service-not-allowed':'⛔ الخدمة غير متاحة هنا — افتح الملف بـ Chrome','audio-capture':'🎤 ما في مايك بالجهاز','network':'🌐 تحتاج إنترنت لتعرف الصوت','no-speech':'🤫 ما سمعت شي — حاول مجدداً بصوت أوضح','aborted':'تم الإلغاء'};
      st.innerHTML='<div class="alert danger">'+(msgs[e.error]||'⚠️ '+e.error)+'</div>';
    };
    voiceRec.onend=function(){btn.classList.remove('listening');};
    voiceRec.start();
  }catch(err){btn.classList.remove('listening');st.innerHTML='<div class="alert danger">⚠️ '+esc(err.message)+'</div>';}
}
function confirmVoice(){
  const p=window._voicePick;if(!p)return;
  addToCart(p.drug.id,p.qty);
  document.getElementById('voice-status').innerHTML='<div class="alert success">✅ '+p.qty+' × '+esc(p.drug.n)+'</div>';
  window._voicePick=null;
}
function cancelVoice(){window._voicePick=null;document.getElementById('voice-status').innerHTML='';}

let bcStream=null;
async function startBarcode(){
  if(!('BarcodeDetector'in window)){alert('Camera scan: Chrome/Android only');return;}
  try{bcStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.getElementById('bc-video');v.srcObject=bcStream;v.style.display='block';v.play();
    const det=new BarcodeDetector();
    const tick=async()=>{if(!bcStream)return;try{const c=await det.detect(v);if(c.length){stopBarcode();onBarcode(c[0].rawValue);return;}}catch(e){}requestAnimationFrame(tick);};tick();
  }catch(e){alert('Camera: '+e.message);}}
function stopBarcode(){if(bcStream){bcStream.getTracks().forEach(x=>x.stop());bcStream=null;}document.getElementById('bc-video').style.display='none';}
function onBarcode(code){const d=PRODUCTS.find(x=>x.bc===code)||search(code)[0];
  const box=document.getElementById('bc-result');
  if(!d){box.innerHTML='<div class="alert warn">? '+esc(code)+'</div>';return;}
  box.innerHTML='<div class="alert success">✓ <b>'+esc(d.n)+'</b> — '+moneyFmt(d.p)+'</div>';addToCart(d.id,1);}

function switchTab(n){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');document.querySelectorAll('.mtab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));document.getElementById('page-'+n).classList.add('active');renderTab(n);}
function renderTab(n){
  if(n==='home')renderHome();if(n==='sell')renderSell();if(n==='drugs')doSearch();
  if(n==='inv')renderInv();if(n==='sup')renderSuppliers();if(n==='cust')renderCustomers();
  if(n==='rep')renderProfits();if(n==='set')renderSettings();}
function renderAll(){renderHome();renderSell();doSearch();renderInv();renderSuppliers();renderCustomers();renderProfits();renderSettings();}
function renderSell(){

}

  document.getElementById('login-user-name').textContent=(curUser()||{}).name||'';

}
